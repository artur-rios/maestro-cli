[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-cli"
version = "2.0.0"
description = "Drive claude, codex and opencode through a plan/execute/review/merge workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
maestro = "maestro.cli:main"
mst = "maestro.cli:main"

[tool.setuptools.packages.find]
include = ["maestro*"]

[tool.ruff.lint]
# ruff's long-standing default rules, pyflakes (F) and pycodestyle's errors (E4, E7, E9), named so that a newer ruff
# with a wider default set does not change what ci/lint.sh checks.
select = ["E4", "E7", "E9", "F"]
