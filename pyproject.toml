[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-orchestrator-cli"
version = "2.0.0"
description = "Drive claude, codex and opencode through a plan/execute/review/merge workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
orchestrator = "agent_orchestrator.cli:main"
aiorch = "agent_orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["agent_orchestrator*"]
